<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Eyes (closed)</title>
<style>
  @font-face {
    font-family: "AnkaCoder";
    src: url("AnkaCoder-r.ttf") format("truetype");
  }
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  html, body {
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
  }
  body {
    font-family: "AnkaCoder", monospace;
    color: #111111;
    background: #ffffff;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 3vh 5vw;
    text-align: center;
  }

  .text-block {
    flex-shrink: 0;
    font-size: clamp(0.7rem, 1.6vw, 1rem);
    line-height: 1.5;
    margin-bottom: 2vh;
  }

  .image-wrap {
    flex: 1;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
    position: relative;
  }

  .image-wrap img {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
    display: block;
    margin: 0 auto;
    position: absolute;
    opacity: 0;
    transition: opacity 0.35s ease;
  }

  .image-wrap img.active {
    opacity: 1;
    position: relative;
  }

  .scroll-hint {
    flex-shrink: 0;
    font-size: clamp(0.65rem, 1.4vw, 0.9rem);
    margin-top: 2vh;
    opacity: 0.6;
  }

  @media (max-width: 600px) {
    body {
      padding: 2vh 4vw;
    }
    .text-block, .scroll-hint {
      font-size: clamp(0.6rem, 3vw, 0.8rem);
    }
  }
</style>
</head>
<body>

  <div class="text-block">
    Eyes (closed)<br>
    (for) better experience.
  </div>

  <div class="image-wrap" id="imageWrap">
    <img src="artwithhotivier.png" alt="Eyes closed 1" class="active" data-index="0">
    <img src="withotifotoart.png" alt="Eyes closed 2" data-index="1">
    <img src="artwithhotidrie.png" alt="Eyes closed 3" data-index="2">
    <img src="artwithhotivijf.png" alt="Eyes closed 4" data-index="3">
  </div>

  <div class="scroll-hint">(scrollen)</div>

  <script>
    const images = document.querySelectorAll('.image-wrap img');
    let current = 0;

    function showImage(index) {
      const total = images.length;
      index = ((index % total) + total) % total;
      if (index === current) return;
      images[current].classList.remove('active');
      current = index;
      images[current].classList.add('active');
    }

    let wheelLock = false;
    window.addEventListener('wheel', (e) => {
      e.preventDefault();
      if (wheelLock) return;
      wheelLock = true;
      setTimeout(() => { wheelLock = false; }, 400);
      if (e.deltaY > 0) {
        showImage(current + 1);
      } else if (e.deltaY < 0) {
        showImage(current - 1);
      }
    }, { passive: false });

    let touchStartY = null;
    window.addEventListener('touchstart', (e) => {
      touchStartY = e.touches[0].clientY;
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      e.preventDefault();
    }, { passive: false });

    window.addEventListener('touchend', (e) => {
      if (touchStartY === null) return;
      const touchEndY = e.changedTouches[0].clientY;
      const diff = touchStartY - touchEndY;
      if (Math.abs(diff) > 40) {
        if (diff > 0) {
          showImage(current + 1);
        } else {
          showImage(current - 1);
        }
      }
      touchStartY = null;
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowDown') showImage(current + 1);
      if (e.key === 'ArrowUp') showImage(current - 1);
    });
  </script>

</body>
</html>
