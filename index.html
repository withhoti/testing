<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Eyes (closed)</title>
<style>
  @font-face {
    font-family: "AnkaCoder";
    src: url("AnkaCoder-r.ttf") format("truetype");
  }
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  html, body {
    height: 100%;
    overflow: hidden;
  }
  body {
    background: #ffffff;
    color: #111111;
    font-family: "AnkaCoder", monospace;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 2.5vh 5vw;
    text-align: center;
    gap: 1.5vh;
  }
  .title {
    font-size: clamp(0.85rem, 2.2vw, 1.6rem);
    flex-shrink: 0;
  }
  .image-wrap {
    flex: 1;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
  }
  .image-wrap img {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
    display: block;
    margin: 0 auto;
  }
  .caption {
    font-size: clamp(0.85rem, 2.2vw, 1.6rem);
    flex-shrink: 0;
  }

  /* Mobiel: iets kleinere tekst en marges, zodat alles gegarandeerd past */
  @media (max-width: 600px) {
    body {
      padding: 2vh 4vw;
      gap: 1vh;
    }
    .title, .caption {
      font-size: clamp(0.75rem, 4vw, 1rem);
    }
  }
</style>
</head>
<body>

  <div class="title">Eyes (closed)</div>

  <div class="image-wrap">
    <img src="withotifotoart.png" alt="Eyes closed">
  </div>

  <div class="caption">(for) better experience.</div>

</body>
</html>
