<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eyes (closed)</title>
<style>

  @font-face {
    font-family: "AnkaCoder";
    src: url("AnkaCoder-r.ttf") format("truetype");
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: #ffffff;
    color: #111111;
    font-family: "AnkaCoder", monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 20px;
    text-align: center;
  }

  .title {
    font-size: 2rem;
    margin-bottom: 40px;
    align-self: flex-start;
    margin-left: 10%;
  }

  .image-wrap {
    max-width: 900px;
    width: 100%;
  }

  .image-wrap img {
    width: 100%;
    height: auto;
    display: block;
  }

  .caption {
    font-size: 1.6rem;
    margin-top: 40px;
    align-self: flex-end;
    margin-right: 10%;
  }

  @media (max-width: 700px) {
    .title, .caption {
      align-self: center;
      margin-left: 0;
      margin-right: 0;
      font-size: 1.3rem;
    }
  }
</style>
</head>
<body>

  <div class="title">Eyes (closed)</div>

  <div class="image-wrap">
    <img src="foto.png" alt="Eyes closed">
  </div>

  <div class="caption">(for) better experience.</div>

</body>
</html>
